<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veyra — Daily Rhythm / רצף יומי</title>
  <style>
    :root{color-scheme:dark;--bg:#060605;--panel:#11100f;--line:#302a23;--ink:#f4f0e9;--muted:#b0a79b;--orange:#ed882d;--green:#a3c6a9;font-family:"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 74% 0%,#4a260c60,transparent 52%),radial-gradient(ellipse at 0% 85%,#49260b25,transparent 45%),var(--bg);min-height:100vh}
    button,input{font:inherit}button{cursor:pointer;color:inherit;background:#1a1713;border:1px solid var(--line);border-radius:9px;padding:11px 17px}button:hover{border-color:var(--orange)}button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:4px}button:disabled{opacity:.55;cursor:wait}a{color:var(--orange)}
    header{border-bottom:1px solid var(--line);padding:19px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;background:#080706b5}
    .brand{direction:ltr;display:flex;align-items:center;gap:12px;letter-spacing:5px;font-weight:650;font-size:18px}.brand b{color:var(--orange);font-size:27px;font-weight:400}.header-end{display:flex;align-items:center;gap:14px}.local{font-size:12px;color:var(--muted)}
    main{max-width:1250px;margin:auto;padding:38px 25px 60px}.preview-note{display:flex;gap:12px;align-items:center;border:1px dashed #654526;border-radius:10px;padding:12px 17px;color:#d9bd9e;font-size:13px;line-height:1.6;background:#1d120940}.preview-note b{white-space:nowrap;color:var(--orange)}
    .heading{display:flex;justify-content:space-between;align-items:end;gap:22px;margin:38px 0 29px}.eyebrow{letter-spacing:4px;font-size:11px;color:var(--orange);direction:ltr;text-align:start}h1{font-size:clamp(35px,5vw,57px);font-weight:550;letter-spacing:-1.5px;margin:10px 0}h2{font-size:20px;font-weight:550;margin:0}h3{font-size:15px;margin:0}p{line-height:1.7;margin:8px 0;color:var(--muted)}.heading p{font-size:15px;max-width:650px}.date{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:7px;line-height:1.9}
    .tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:24px}.tabs button{background:transparent;border-color:transparent}.tabs button[aria-selected="true"]{background:#e7832517;color:#ffb36c;border-color:#694525}.tabs .preserved{margin-inline-start:auto;align-self:center;color:var(--green);font-size:12px}
    .layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#191510e8,#0e0e0de8);border-radius:18px;padding:25px;box-shadow:0 12px 40px #0003}.hero{position:relative;overflow:hidden;padding:32px;min-height:265px;display:grid;grid-template-columns:1fr 170px;align-items:center;gap:20px}.hero:after{content:"";position:absolute;inset:auto -12% -175px auto;width:370px;height:370px;background:radial-gradient(circle,#c8631727,transparent 68%);pointer-events:none}.label{font-size:13px;color:var(--muted)}.big{font-size:86px;line-height:1.1;font-weight:550;letter-spacing:-4px;direction:ltr;text-align:start;margin:5px 0}.big small{font-size:17px;font-weight:400;color:var(--muted);letter-spacing:0;margin-inline-start:10px}.status-pill{display:inline-flex;align-items:center;gap:8px;color:#d8b792;border:1px solid #5b3e22;padding:7px 12px;border-radius:30px;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px #ed882d70}
    .seal{width:166px;aspect-ratio:1;border:1px solid #916237;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 35px #f28a2510,0 0 70px #c7601710;background:radial-gradient(circle at 30% 20%,#74503655,#110f0d 68%)}.seal:before{content:"";position:absolute;inset:10px;border:1px solid #694525;border-radius:50%}.seal svg{width:67px;height:82px;filter:drop-shadow(0 5px 10px #000);color:#eab279}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:19px;border-top:1px solid var(--line);padding-top:18px;gap:10px}.stats strong{font-size:24px;display:block;font-weight:550;direction:ltr;text-align:start}.stats span{font-size:12px;color:var(--muted)}.stack{display:grid;gap:20px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}.tag{font-size:11px;padding:5px 8px;border-radius:6px;background:#ed882d17;color:#e4b587;border:1px solid #684326;white-space:nowrap}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;direction:ltr}.day{aspect-ratio:1.24;border:1px solid #2e2922;border-radius:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:13px;color:#82796e;background:#121110}.day.done{color:#ffd0a2;background:linear-gradient(155deg,#98501f57,#6c371d3b);border-color:#85562f}.day.today{border:1px solid #f1a05a;box-shadow:0 0 0 2px #e7832520;color:#ffe0bf}.day small{font-size:9px;height:11px}.legend{display:flex;gap:19px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border:1px solid #745335;margin-inline-end:7px;border-radius:2px}.legend span:first-child:before{background:#9e592a}.legend span:last-child:before{border-color:#f1a05a}
    .task{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:35px 1fr;gap:11px}.task-icon{font-size:21px;color:#d4a875}.task p{font-size:12px;margin:5px 0}.task:last-of-type{border-bottom:0}.task .tag{display:inline-block;margin-bottom:9px}.primary{color:#211006;background:linear-gradient(135deg,#f3a05b,#df7628);border-color:#d0803d;font-weight:650;width:100%;margin-top:15px}.secondary{width:100%;margin-top:9px;background:transparent}.fine{font-size:11px!important;color:#aaa095}.sync{border-top:1px solid var(--line);padding-top:17px;margin-top:20px;font-size:12px;line-height:1.8}.sync strong{color:var(--green);font-weight:500}.sync.error strong{color:#f3b2a1}
    .milestones{margin-top:20px}.goal-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:10px}.track{height:5px;background:#32271b;border-radius:20px;overflow:hidden;direction:ltr}.track div{width:46.66%;height:100%;background:linear-gradient(90deg,#78421d,#eda25d);border-radius:20px}.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px}.badge{display:flex;flex-direction:column;align-items:center;padding:11px 4px;gap:6px;border:1px solid #302a23;border-radius:10px;color:#968b7d;font-size:11px}.badge b{font-size:19px;font-weight:500}.badge.earned{color:#ecc29b;border-color:#6d4a2d;background:#6c3e1a15}
    .review{margin-top:30px;border-top:1px solid var(--line);padding-top:24px}.review h2{font-size:16px}.states{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.states button{font-size:12px;padding:9px 13px}.states button[aria-pressed="true"]{border-color:var(--orange);color:#ffc792}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.impact article{padding:17px;border:1px solid var(--line);border-radius:12px}.impact h3{font-size:13px}.impact p{font-size:12px}.impact .keep{color:var(--green)}.impact .new{color:var(--orange)}footer{font-size:11px;color:#91877b;margin-top:24px;line-height:1.8}
    #goal{direction:ltr;unicode-bidi:isolate}
    [hidden]{display:none!important}.alt{padding:35px;min-height:250px}.alt p{max-width:750px}.alt button{margin-top:12px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.heading{display:block}.date{margin-top:12px}.hero{grid-template-columns:1fr 110px;padding:23px}.seal{width:108px}.seal svg{width:43px}.big{font-size:68px}.impact{grid-template-columns:1fr}.tabs .preserved{width:100%;margin:7px 0 0}.panel{padding:20px}.preview-note{align-items:flex-start;flex-direction:column;gap:3px}.local{display:none}header{padding:16px 21px}main{padding:25px 16px}.badges{gap:5px}.day{min-height:40px}.heading{margin-top:27px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header><div class="brand"><b aria-hidden="true">V</b> VEYRA <span style="font-size:10px;letter-spacing:2px;color:#b29c81">CHESS</span></div><div class="header-end"><span class="local" data-he="תצוגה מקומית · ללא חיבור לחשבון" data-en="Local preview · no account connection"></span><button id="language" type="button">EN</button></div></header>
  <main>
    <aside class="preview-note"><b data-he="הדגמה בלבד" data-en="PREVIEW ONLY"></b><span data-he="נתוני דוגמה מ־30.10.2026. זו הצעה חזותית, לא צילום של האתר הפעיל. אין כאן שמירה לחשבון, מחיקת נתונים או שינוי שמע." data-en="Sample data for 30 Oct 2026. A visual proposal, not the live site. No account writes, data deletion or audio changes."></span></aside>
    <section class="heading"><div><div class="eyebrow">YOUR DAILY RHYTHM</div><h1 data-he="עוד יום. עוד צעד קדימה." data-en="Another day. A little stronger."></h1><p data-he="לא צריך לנצח בכל משחק. צריך להמשיך ללמוד. הרצף שלך מתקדם מפעילות שהשרת אימת — לא מהבטחות." data-en="You do not have to win every game. Keep learning. Your streak advances through verified activity, not promises."></p></div><div class="date"><span data-he="יום שישי · 30 באוקטובר 2026" data-en="Friday · 30 October 2026"></span><br><span dir="ltr">Asia/Jerusalem</span></div></section>
    <nav class="tabs" role="tablist" aria-label="Preview sections">
      <button role="tab" id="tab-daily" aria-selected="true" aria-controls="daily" data-tab="daily" data-he="הרצף היומי" data-en="Daily streak"></button>
      <button role="tab" id="tab-puzzles" aria-selected="false" aria-controls="puzzles" data-tab="puzzles" data-he="רצף הפאזלים" data-en="Puzzle streak"></button>
      <button role="tab" id="tab-openings" aria-selected="false" aria-controls="openings" data-tab="openings" data-he="לימוד פתיחות" data-en="Opening study"></button>
      <span class="preserved" data-he="✓ ההתקדמות הקיימת נשמרת" data-en="✓ Existing progress stays intact"></span>
    </nav>
    <section id="daily" role="tabpanel" aria-labelledby="tab-daily">
      <div class="layout">
        <div>
          <section class="panel">
            <div class="hero">
              <div><span class="label" data-he="הרצף היומי שלך" data-en="YOUR CURRENT STREAK"></span><div class="big"><span id="current">14</span><small data-he="ימים" data-en="days"></small></div><span class="status-pill"><span class="dot"></span><span id="day-status"></span></span></div>
              <div class="seal" aria-hidden="true"><svg viewBox="0 0 64 80" fill="none"><path d="M37 5C43 23 25 26 34 39C42 37 46 31 45 26C62 46 55 69 34 74C11 73 4 55 13 40C17 32 25 24 24 16C31 21 29 28 30 30C37 24 34 15 37 5Z" fill="currentColor"/><path d="M32 43C36 53 24 55 29 66C36 70 42 61 39 55C47 66 40 73 33 73C20 69 20 57 32 43Z" fill="#17100a"/></svg></div>
            </div>
            <div class="stats"><div><strong id="best">28</strong><span data-he="השיא האישי · לא מתאפס" data-en="Personal best · never reset"></span></div><div><strong id="active">20 / 35</strong><span data-he="ימים פעילים בחלון המוצג" data-en="Active days in this window"></span></div><div><strong>7 · 14</strong><span data-he="אבני דרך שכבר הושגו" data-en="Milestones already earned"></span></div></div>
          </section>
          <section class="panel milestones"><div class="card-head"><h2 data-he="לוח הפעילות שלך" data-en="Your activity calendar"></h2><span class="label" data-he="35 הימים האחרונים" data-en="Last 35 days"></span></div><div class="days" id="calendar" role="list"></div><div class="legend"><span data-he="יום מאומת" data-en="Verified day"></span><span data-he="אין פעילות מאומתת" data-en="No verified activity"></span><span data-he="היום עדיין פתוח" data-en="Today is still open"></span></div></section>
        </div>
        <aside class="stack">
          <section class="panel"><div class="card-head"><h2 data-he="הצעד של היום" data-en="Today's next step"></h2><span class="tag" data-he="פעילות אחת מספיקה" data-en="One activity is enough"></span></div>
            <div class="task"><span class="task-icon" aria-hidden="true">◇</span><div><h3 data-he="פתרון פאזל" data-en="Solve a puzzle"></h3><p data-he="המסלול הקיים. פתרון שאושר בשרת מזכה ביום פעילות." data-en="The existing path. A server-accepted solution qualifies the day."></p></div></div>
            <div class="task"><span class="task-icon" aria-hidden="true">↗</span><div><span class="tag" data-he="התוספת שנשמרת מ־#18" data-en="Value preserved from #18"></span><h3 data-he="השלמת לימוד פתיחה" data-en="Complete an opening"></h3><p data-he="למד את כל קווי הליבה. השרת בודק את רצף המהלכים מול הרפרטואר לפני שהיום נספר." data-en="Learn every required line. The server checks the move transcript against the repertoire before the day counts."></p></div></div>
            <button type="button" class="primary" id="complete" data-he="הדגם השלמת פתיחה ואימות" data-en="Demo opening completion and verification"></button>
            <button type="button" class="secondary" id="offline" data-he="הדגם השלמה ללא חיבור" data-en="Demo offline completion"></button>
            <p class="fine" data-he="כפתורי ההדגמה אינם מסיימים אימון אמיתי ואינם פונים לשרת." data-en="Demo buttons do not complete real training or contact a server."></p>
            <div class="sync" id="sync" aria-live="polite"><strong id="sync-title"></strong><p id="sync-message"></p></div>
          </section>
          <section class="panel"><div class="goal-line"><span data-he="היעד הבא: 30 ימים" data-en="Next milestone: 30 days"></span><span id="goal">14 / 30</span></div><div class="track" aria-hidden="true"><div id="progress"></div></div><div class="badges" id="badges"></div><p class="fine" data-he="התגים נגזרים מהשיא ההיסטורי. יום חסר לא מוחק הישגים שכבר הושגו." data-en="Badges derive from your historical best. A missed day does not erase earned milestones."></p></section>
        </aside>
      </div>
    </section>
    <section id="puzzles" class="panel alt" role="tabpanel" aria-labelledby="tab-puzzles" hidden><span class="eyebrow">PRESERVED / UNCHANGED</span><h2 data-he="רצף הפאזלים נשאר נפרד." data-en="Your puzzle streak stays separate."></h2><p data-he="מספר הפאזלים שנפתרו בלי טעות, השיא המקומי, הרמזים, מצבי האימון ו־Rush נשארים כפי שהם. הרצף היומי סופר ימים — הוא לא מחליף את רצף הפתרונות." data-en="Consecutive correct answers, local high scores, hints, training modes and Rush stay unchanged. Daily streaks count days; they do not replace puzzle-solving streaks."></p><p class="fine" data-he="זהו הסבר בהדגמה, לא משחק פאזל פעיל." data-en="This is an explanatory preview, not a playable puzzle."></p><button type="button" data-return data-he="חזרה להדגמת הרצף היומי" data-en="Back to daily streak preview"></button></section>
    <section id="openings" class="panel alt" role="tabpanel" aria-labelledby="tab-openings" hidden><span class="eyebrow">ADDITIVE / NO RESET</span><h2 data-he="הקו האחרון הופך ליום של התקדמות." data-en="The last line becomes a day of progress."></h2><p data-he="מאמן הפתיחות נשאר כפי שהוא. רק אחרי השלמה חדשה של כל קווי הליבה נשלח תמליל לאימות. השלמות ישנות לא מזוכות מחדש רק כי פתחת את העמוד. אין החלפה של נתוני לימוד קיימים." data-en="The opening trainer stays intact. Only newly completing all required lines submits a transcript for verification. Visiting the page does not re-credit historical completions. Existing learning progress is not replaced."></p><p class="fine" data-he="בלי חיבור: הפעילות נשארת בתור נפרד לחשבון. לאחר אישור היא משויכת ליום שבו התקבלה בשרת — ללא שינוי תאריכים לאחור." data-en="Offline: activity stays in a separate account-scoped queue. Once accepted, it qualifies the server receipt date; it is never backdated."></p><button type="button" id="opening-demo" data-he="הצג את התוצאה לאחר אימות" data-en="Show the verified result"></button></section>
    <section class="review"><h2 data-he="בדקו את המצבים לפני אישור העיצוב" data-en="Review the states before approving the design"></h2><div class="states" id="states">
      <button type="button" data-state="open" aria-pressed="true" data-he="היום פתוח" data-en="Today open"></button><button type="button" data-state="accepted" aria-pressed="false" data-he="אומת בשרת" data-en="Verified"></button><button type="button" data-state="pending" aria-pressed="false" data-he="ממתין לסנכרון" data-en="Pending sync"></button><button type="button" data-state="error" aria-pressed="false" data-he="שגיאת טעינה" data-en="Load error"></button><button type="button" data-state="disabled" aria-pressed="false" data-he="לא הופעל" data-en="Not enabled"></button>
    </div><div class="impact">
      <article><h3 class="keep" data-he="נשמר — ללא החלפה" data-en="Preserved — not replaced"></h3><p data-he="היסטוריה ושיאים, הרצף היומי, רצף הפאזלים, שמירת התקדמות, אזורי זמן, הצלילים והגדרות הווליום." data-en="History and bests, daily and puzzle streaks, learning progress, timezone rules, sounds and volume settings."></p></article>
      <article><h3 class="new" data-he="נוסף — מעל הקיים" data-en="Added — on top of existing behavior"></h3><p data-he="אימות השלמת פתיחה, תור מבודד לחשבון, הודעות סנכרון ובדיקות לשמירת ההתנהגות הקיימת." data-en="Opening completion verification, an isolated account queue, sync feedback and preservation regression checks."></p></article>
      <article><h3 data-he="לא נעשה" data-en="Not performed"></h3><p data-he="אין מחיקת טבלאות או נתונים, אין הפעלה בייצור, ואין העתקה של המימוש הישן מעל החדש. #18 נשאר שמור עד אישורך." data-en="No tables or data deleted, no production activation, and no old implementation copied over the new one. #18 stays preserved pending approval."></p></article>
    </div></section>
    <footer data-he="הפריסה המוצעת מפרידה חזותית בין הרצפים. כרגע במוצר הכרטיס היומי נמצא במסך רצף הפאזלים; שינוי הפריסה דורש אישור נפרד. נתוני הדגמה בלבד · ללא רשת · ללא localStorage · ללא שינוי שמע." data-en="The proposed layout visually separates the streaks. In the current product the daily card sits within the puzzle streak screen; layout changes require separate approval. Sample data only · no network · no localStorage · no audio changes."></footer>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    let lang='he',state='open',timer;
    const text=(he,en)=>lang==='he'?he:en;
    function tab(name){document.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===name)));['daily','puzzles','openings'].forEach(id=>$(id).hidden=id!==name);}
    function render(){
      document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
      document.querySelectorAll('[data-he]').forEach(el=>el.textContent=el.dataset[lang]);$('language').textContent=lang==='he'?'EN':'עברית';
      const verified=state==='accepted',unavailable=['error','disabled'].includes(state),days=verified?15:14;
      document.querySelector('.stats > div:last-child strong').textContent=unavailable?'—':'7 · 14';
      $('current').textContent=unavailable?'—':days;$('best').textContent=unavailable?'—':'28';$('active').textContent=unavailable?'—':`${verified?21:20} / 35`;$('goal').textContent=unavailable?'—':`${days} / 30`;$('progress').style.width=unavailable?'0':`${days/30*100}%`;
      const messages={
        open:[text('עד אתמול · היום עוד אפשר להתאמן','Through yesterday · today is still open'),text('הנתונים האחרונים אומתו','Last saved data verified'),text('פתרון פאזל או השלמת פתיחה יכולים לשמור על הרצף. היום לא מסומן כהחמצה לפני שנגמר.','A puzzle solution or opening completion can extend your streak. Today is not marked missed before it ends.')],
        accepted:[text('היום הושלם · ממשיכים מחר','Today complete · keep going tomorrow'),text('הפתיחה אומתה — נוסף יום אחד','Opening verified — one day added'),text('השיא נשאר 28. עוד פעילות היום לא תוסיף עוד יום לרצף. זו הדגמה בלבד.','Your best remains 28. More activity today does not add another streak day. This is a demo only.')],
        pending:[text('היום ממתין לאימות · עדיין לא נספר','Today pending verification · not counted'),text('פתיחה אחת ממתינה בתור','One opening activity is queued'),text('הנתונים המאומתים נשארו 14 ימים. האימות ביום החיבור יקבע את התאריך, ולא תאריך המכשיר.','Verified data stays at 14 days. The server receipt date will count, not the device date.')],
        error:[text('הטעינה נכשלה · הנתונים לא נמחקו','Load failed · data was not deleted'),text('לא ניתן לטעון כרגע','Could not load right now'),text('לא מציגים אפסים במקום נתונים חסרים. בחרו מצב אחר כדי להמשיך בהדגמה.','Missing data is not displayed as zero performance. Choose another state to continue the demo.')],
        disabled:[text('הרצף לא הופעל בשרת','Daily streak is not enabled'),text('נדרש אישור הפעלה נפרד','Separate activation approval required'),text('האימונים והשיאים הקיימים אינם משתנים. אין כאן הפעלה של מסד נתונים או שינוי הגדרות השרת.','Existing training and bests are unchanged. This preview does not activate storage or change server settings.')],
      };
      const message=messages[state];$('day-status').textContent=message[0];$('sync-title').textContent=message[1];$('sync-message').textContent=message[2];$('sync').classList.toggle('error',state==='error');
      $('calendar').replaceChildren();for(let i=0;i<35;i++){const date=new Date(Date.UTC(2026,8,26+i)),key=date.toISOString().slice(0,10),today=i===34,done=!unavailable&&((i>=20&&i<34)||(i>=2&&i<8)||(today&&verified));const el=document.createElement('div');el.className='day'+(done?' done':'')+(today?' today':'');el.setAttribute('role','listitem');el.setAttribute('aria-label',`${key}: ${unavailable?text('לא זמין','Unavailable'):done?text('פעילות מאומתת','Verified activity'):today?text('היום פתוח','Today open'):text('ללא פעילות מאומתת','No verified activity')}`);const number=document.createElement('span');number.textContent=String(date.getUTCDate());const mark=document.createElement('small');mark.textContent=done?'✓':today?text('היום','TODAY'):'';el.append(number,mark);$('calendar').append(el);}
      $('badges').replaceChildren();[7,14,30,50,100,365].forEach(n=>{const el=document.createElement('div');el.className='badge'+(!unavailable&&n<=28?' earned':'');const b=document.createElement('b');b.textContent=n;const label=document.createElement('span');label.textContent=unavailable?'—':n<=28?text('הושג','Earned'):text('בהמשך','Ahead');el.append(b,label);$('badges').append(el);});
      document.querySelectorAll('[data-state]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.state===state)));
    }
    function setState(next){clearTimeout(timer);$('complete').disabled=false;state=next;tab('daily');render();}
    $('language').onclick=()=>{lang=lang==='he'?'en':'he';render();};
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>tab(button.dataset.tab));
    document.querySelectorAll('[data-return]').forEach(button=>button.onclick=()=>tab('daily'));
    document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>setState(button.dataset.state));
    $('offline').onclick=()=>setState('pending');$('opening-demo').onclick=()=>setState('accepted');
    $('complete').onclick=()=>{setState('pending');$('complete').disabled=true;$('sync-title').textContent=text('מדמה אימות…','Simulating verification…');timer=setTimeout(()=>setState('accepted'),650);};
    render();
  </script>
</body>
</html>
