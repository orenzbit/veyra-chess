name: Verify Magnus Carlsen profile

# Share the existing PR verification concurrency group so a stale full run is
# cancelled before this focused run starts. No tournament steps exist here.
concurrency:
  group: verify-${{ github.event.pull_request.number || (github.ref_name == 'player-data-batch' && '17') || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [player-data-batch]
    paths:
      - '.github/workflows/verify-magnus-carlsen.yml'
      - 'scripts/build-historical-legend-bots.mjs'
      - 'scripts/check-legends.mjs'
      - 'scripts/check-historical-holdout.mjs'
      - 'scripts/check-historical-stockfish.mjs'
      - 'public/data/bots/anand.json'
      - 'public/data/bots/carlsen.json'
      - 'public/data/bots/index.json'
      - 'docs/LEGENDS_PGN_RESEARCH.md'
      - 'docs/LEGENDS_PROGRESS.md'
      - 'docs/LEGENDS_BOT_ROADMAP.md'
      - 'Anand.pgn'
      - 'Carlsen.pgn'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify:
    name: Rebuild Anand and Carlsen; run quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Anand only
        run: npm run build:legend-bots -- --only=anand

      - name: Build Carlsen only
        run: npm run build:legend-bots -- --only=carlsen

      - name: Verify bot profiles and source provenance
        run: npm run check:release

      - name: Build production output
        run: npm run build

      - name: Validate tactical accuracy
        run: npm run check:bot-accuracy

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Validate held-out positions
        run: npm run check:historical-holdout

      - name: Upload holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlsen-and-anand-holdout-report
          path: artifacts/historical-holdout/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate Stockfish move quality
        run: npm run check:historical-stockfish

      - name: Upload Stockfish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlsen-and-anand-stockfish-report
          path: artifacts/historical-stockfish/
          if-no-files-found: warn
          retention-days: 30

      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Verify board in a real browser
        run: node scripts/check-browser-board.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlsen-and-anand-browser-evidence
          path: artifacts/chess-board/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated profiles after checks
        if: always() && github.ref == 'refs/heads/player-data-batch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add public/data/bots/anand.json public/data/bots/carlsen.json public/data/bots/index.json docs/LEGENDS_PGN_RESEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate Anand and Carlsen profiles [skip ci]'
          # The PGN branch can advance while the long profile build runs. Rebase our generated-only commit safely.
          for attempt in 1 2 3; do
            git fetch origin player-data-batch
            if ! git rebase origin/player-data-batch; then
              git rebase --abort || true
              echo "::error::Generated-profile commit conflicts with newer branch changes; refusing to overwrite them."
              exit 1
            fi
            if git push origin 'HEAD:player-data-batch'; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; refreshing branch head and retrying."
          done
          echo "::error::Could not push generated profiles after three safe attempts."
          exit 1
