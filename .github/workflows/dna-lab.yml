name: DNA lab

# Lab pipeline for the historical bots, one bot at a time. Runs only on the dna-lab branch.
# Edit dna-lab/request.json (bot number, stages, sample size) and push to start a run.
# Results are uploaded as artifacts; this workflow never commits or pushes.
on:
  push:
    branches: [dna-lab]
    paths: ['dna-lab/request.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Read lab request
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.request.outputs.bot }}
      stages: ${{ steps.request.outputs.stages }}
      count: ${{ steps.request.outputs.count }}
      shards: ${{ steps.request.outputs.shards }}
      shard_list: ${{ steps.request.outputs.shard_list }}
      conf_count: ${{ steps.request.outputs.conf_count }}
      conf_shards: ${{ steps.request.outputs.conf_shards }}
      conf_shard_list: ${{ steps.request.outputs.conf_shard_list }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        run: |
          node -e '
            const r = require("./dna-lab/request.json");
            const shards = Number(r.shards || 20);
            const confShards = Number(r.conformanceShards || 30);
            const out = [
              "bot=" + Number(r.bot),
              "stages=" + (r.stages || []).join(","),
              "count=" + Number(r.count || 500),
              "shards=" + shards,
              "shard_list=" + JSON.stringify(Array.from({ length: shards }, (_, i) => i)),
              "conf_count=" + Number(r.conformanceCount || 150),
              "conf_shards=" + confShards,
              "conf_shard_list=" + JSON.stringify(Array.from({ length: confShards }, (_, i) => i))
            ];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '

  dna-select:
    name: Select best games (bot ${{ needs.plan.outputs.bot }})
    needs: plan
    if: contains(needs.plan.outputs.stages, 'dna')
    runs-on: ubuntu-latest
    environment: dna-lab
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/dna-lab/select-games.mjs --bot=${{ needs.plan.outputs.bot }} --count=${{ needs.plan.outputs.count }} --out=artifacts/dna-lab/selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: dna-selection
          path: artifacts/dna-lab/selection.json
          retention-days: 30

  dna-shard:
    name: DNA shard ${{ matrix.shard }}
    needs: [plan, dna-select]
    runs-on: ubuntu-latest
    environment: dna-lab
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dna-selection
          path: artifacts/dna-lab
      - run: node scripts/dna-lab/analyze-dna.mjs --selection=artifacts/dna-lab/selection.json --shard=${{ matrix.shard }} --shards=${{ needs.plan.outputs.shards }} --out=artifacts/dna-lab/shards
      - uses: actions/upload-artifact@v4
        with:
          name: dna-shard-${{ matrix.shard }}
          path: artifacts/dna-lab/shards/
          retention-days: 30

  dna-report:
    name: Build DNA report (bot ${{ needs.plan.outputs.bot }})
    needs: [plan, dna-shard]
    if: always() && needs.dna-shard.result != 'skipped'
    runs-on: ubuntu-latest
    environment: dna-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dna-selection
          path: artifacts/dna-lab
      - uses: actions/download-artifact@v4
        with:
          pattern: dna-shard-*
          merge-multiple: true
          path: artifacts/dna-lab/shards
      - run: |
          slug=$(node scripts/dna-lab/roster.mjs slug ${{ needs.plan.outputs.bot }})
          node scripts/dna-lab/build-dna-report.mjs --selection=artifacts/dna-lab/selection.json --shards=artifacts/dna-lab/shards --out=artifacts/dna-lab/report/$slug/DNA.md
          cat artifacts/dna-lab/report/$slug/DNA.md | sed '/dna-data:start/,$d' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dna-report
          path: artifacts/dna-lab/report/
          retention-days: 90

  checks:
    name: Readiness checks (bot ${{ needs.plan.outputs.bot }})
    needs: plan
    if: contains(needs.plan.outputs.stages, 'checks')
    runs-on: ubuntu-latest
    environment: dna-lab
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (rules bundle, dist)
        run: npm run build
      - name: Resolve profile id
        id: bot
        run: echo "id=$(node scripts/dna-lab/roster.mjs id ${{ needs.plan.outputs.bot }})" >> "$GITHUB_OUTPUT"
      - name: Profile, identity, provenance and phrase checks
        id: legends
        continue-on-error: true
        env:
          HISTORICAL_BOT_IDS: ${{ steps.bot.outputs.id }}
        run: npm run check:legends
      - name: Tactical accuracy
        id: accuracy
        continue-on-error: true
        env:
          HISTORICAL_BOT_IDS: ${{ steps.bot.outputs.id }}
        run: npm run check:bot-accuracy
      - name: Held-out positions
        id: holdout
        continue-on-error: true
        env:
          HISTORICAL_BOT_IDS: ${{ steps.bot.outputs.id }}
        run: node scripts/check-historical-holdout.mjs
      - name: Surprise opponent moves
        id: surprise
        continue-on-error: true
        env:
          HISTORICAL_BOT_IDS: ${{ steps.bot.outputs.id }}
        run: node scripts/check-historical-surprise.mjs
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Stockfish move quality (debug log)
        id: stockfish
        continue-on-error: true
        env:
          HISTORICAL_BOT_IDS: ${{ steps.bot.outputs.id }}
          STOCKFISH_DEPTH: 5
          STOCKFISH_POSITIONS_PER_BOT: 4
          STOCKFISH_SEARCH_TIMEOUT_MS: 15000
          STOCKFISH_DEBUG: '1'
        run: node scripts/check-historical-stockfish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-reports
          path: |
            artifacts/historical-holdout/
            artifacts/historical-stockfish/
            artifacts/historical-surprise/
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          {
            echo "## Readiness checks, bot ${{ needs.plan.outputs.bot }}"
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Profile / identity / phrases | ${{ steps.legends.outcome }} |"
            echo "| Tactical accuracy | ${{ steps.accuracy.outcome }} |"
            echo "| Held-out positions | ${{ steps.holdout.outcome }} |"
            echo "| Surprise moves | ${{ steps.surprise.outcome }} |"
            echo "| Stockfish quality | ${{ steps.stockfish.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "${{ steps.legends.outcome }}" "${{ steps.accuracy.outcome }}" "${{ steps.holdout.outcome }}" "${{ steps.surprise.outcome }}" "${{ steps.stockfish.outcome }}"; do
            if [ "$outcome" != "success" ]; then exit 1; fi
          done

  conf-plan:
    name: Conformance plan (bot ${{ needs.plan.outputs.bot }})
    needs: plan
    if: contains(needs.plan.outputs.stages, 'conformance')
    runs-on: ubuntu-latest
    environment: dna-lab
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          slug=$(node scripts/dna-lab/roster.mjs slug ${{ needs.plan.outputs.bot }})
          node scripts/dna-lab/conformance-plan.mjs --bot=${{ needs.plan.outputs.bot }} --dna=docs/bots/$slug/DNA.md --count=${{ needs.plan.outputs.conf_count }} --out=artifacts/dna-lab/conformance/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-plan
          path: artifacts/dna-lab/conformance/plan.json
          retention-days: 30

  conf-shard:
    name: Conformance shard ${{ matrix.shard }}
    needs: [plan, conf-plan]
    runs-on: ubuntu-latest
    environment: dna-lab
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.conf_shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: conformance-plan
          path: artifacts/dna-lab/conformance
      - run: node scripts/dna-lab/conformance-shard.mjs --bot=${{ needs.plan.outputs.bot }} --plan=artifacts/dna-lab/conformance/plan.json --shard=${{ matrix.shard }} --shards=${{ needs.plan.outputs.conf_shards }} --out=artifacts/dna-lab/conformance/shards
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-shard-${{ matrix.shard }}
          path: artifacts/dna-lab/conformance/shards/
          retention-days: 30

  conf-report:
    name: Conformance report (bot ${{ needs.plan.outputs.bot }})
    needs: [plan, conf-shard]
    if: always() && needs.conf-shard.result != 'skipped'
    runs-on: ubuntu-latest
    environment: dna-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: conformance-plan
          path: artifacts/dna-lab/conformance
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-shard-*
          merge-multiple: true
          path: artifacts/dna-lab/conformance/shards
      - run: |
          node scripts/dna-lab/conformance-report.mjs --plan=artifacts/dna-lab/conformance/plan.json --shards=artifacts/dna-lab/conformance/shards --out=artifacts/dna-lab/conformance/conformance.md
          cat artifacts/dna-lab/conformance/conformance.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            artifacts/dna-lab/conformance/conformance.md
            artifacts/dna-lab/conformance/conformance.json
            artifacts/dna-lab/conformance/plan.json
          retention-days: 90