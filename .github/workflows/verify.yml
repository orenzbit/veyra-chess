name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and product checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check archive integration and regressions
        run: npm run check:archive
      - name: Check product surfaces and security scaffolding
        run: npm run check:product
      - name: Run release structure checks
        run: npm run check:release
      - name: Build production output
        run: npm run build
