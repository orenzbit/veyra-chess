name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck and product checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check committed rules bundle before build
        run: node scripts/build-rules.mjs --check
      - name: Check archive integration and regressions
        run: npm run check:archive
      - name: Check cross-device account synchronization
        run: npm run check:account-sync
      - name: Check product surfaces and security scaffolding
        run: npm run check:product
      - name: Run release structure checks
        run: npm run check:release
      - name: Build production output
        run: npm run build
      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify board in a real browser and capture screenshots
        run: node scripts/check-browser-board.mjs
      - name: Upload chessboard screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-board-browser-evidence
          path: artifacts/chess-board/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify generated rules bundle
        run: node scripts/build-rules.mjs --check
      - name: Check deterministic bot tactical accuracy
        run: npm run check:bot-accuracy
      - name: Commit regenerated rules bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/vendor/veyra-rules/chess-compat.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vendor/veyra-rules/chess-compat.js
          git commit -m 'Regenerate Veyra rules bundle'
          git push

      - name: Commit generated bot profiles after quality checks
        if: success() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main')
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add public/data/bots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate source-grounded Legends bots [skip ci]"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            git push origin HEAD:main
          fi

      - name: Run complete Legends round-robin tournament
        run: npm run tournament:legends -- --out=artifacts/legends-tournament

      - name: Render per-game PNGs and update README galleries
        if: success()
        env:
          TOURNAMENT_PHASE: ${{ github.event_name == 'pull_request' && 'pre-merge' || 'post-merge' }}
        run: node scripts/render-tournament-evidence.mjs --input=artifacts/legends-tournament/games.jsonl --summary=artifacts/legends-tournament/summary.json --phase="$TOURNAMENT_PHASE"

      - name: Render Tal match visualization after the post-merge tournament
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: node scripts/render-tal-match-visualization.mjs --input=artifacts/legends-tournament/games.jsonl --opponent=capablanca

      - name: Upload Legends tournament report and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-tournament-evidence
          path: |
            artifacts/legends-tournament/
            docs/tournaments/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated tournament evidence
        if: success() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main')
        env:
          TOURNAMENT_PHASE: ${{ github.event_name == 'pull_request' && 'pre-merge' || 'post-merge' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add README.md docs/tournaments/ public/data/bots/ public/legends/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record ${TOURNAMENT_PHASE} Legends tournament [skip ci]"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            git push origin HEAD:main
          fi
