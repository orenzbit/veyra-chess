name: Verify project

# Only one PR-head verification may perform the expensive historical PGN build at a time.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      tournament_approved:
        description: 'Explicit user approval to run the full Legends tournament'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify:
    name: Typecheck and product checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency tree for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check committed rules bundle before build
        run: node scripts/build-rules.mjs --check
      - name: Check archive integration and regressions
        run: npm run check:archive
      - name: Check cross-device account synchronization
        run: npm run check:account-sync
      - name: Check daily streak date rules, API security contract and schema isolation
        run: npm run check:daily-streak
      - name: Check product surfaces and security scaffolding
        run: npm run check:product
      - name: Generate historical profiles when missing or stale
        run: |
          if node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("public/data/bots/index.json","utf8")); const b=m.find(x=>x.id==="anand"); process.exit(m.length===61 && b && b.name==="The Lightning Strategist" && b.phraseArchiveVersion===2 && b.sourceGeneratorVersion===4 && b.sourceFile==="Anand.pgn" && b.sourceSha256 && b.styleMetrics && b.exampleGames?.length>=2 && b.openingsAsWhite?.length>=8 && b.openingsAsBlack?.length>=8 && fs.existsSync("docs/LEGENDS_PGN_RESEARCH.md") ? 0 : 1)'; then
            echo "Anand profile already generated by version 4; leaving every other bot untouched."
          else
            npm run build:legend-bots -- --only=anand
          fi

      - name: Commit historical profile checkpoint before full checks
        if: success() && github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true
        env:
          PR_HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add public/data/bots/ docs/LEGENDS_PGN_RESEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: checkpoint generated historical profiles [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Run release structure checks
        env:
          HISTORICAL_BOT_IDS: anand
        run: npm run check:release
      - name: Build production output
        run: npm run build

      - name: Validate tactical accuracy for the default historical bot
        env:
          HISTORICAL_BOT_IDS: anand
        run: npm run check:bot-accuracy

      - name: Install Stockfish for historical move-quality analysis
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Upload Stockfish quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-stockfish-quality-report
          path: artifacts/historical-stockfish/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate held-out historical positions and style overlap
        run: npm run check:historical-holdout

      - name: Upload held-out historical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-holdout-report
          path: |
            artifacts/historical-holdout/
            artifacts/historical-stockfish/
          if-no-files-found: warn
          retention-days: 30
      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify board in a real browser and capture screenshots
        run: node scripts/check-browser-board.mjs
      - name: Upload chessboard screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-board-browser-evidence
          path: artifacts/chess-board/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify generated rules bundle
        run: node scripts/build-rules.mjs --check
      - name: Check deterministic tactical accuracy for the default historical bot
        env:
          HISTORICAL_BOT_IDS: anand
        run: npm run check:bot-accuracy
      - name: Commit regenerated rules bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/vendor/veyra-rules/chess-compat.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vendor/veyra-rules/chess-compat.js
          git commit -m 'Regenerate Veyra rules bundle'
          git push

      - name: Commit generated bot profiles after quality checks
        if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          PR_HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add public/data/bots/ docs/LEGENDS_PGN_RESEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate source-grounded Legends bots [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Record tournament approval gate
        if: success() && github.event_name == 'pull_request'
        run: echo "PRE-MERGE CHECKS COMPLETE. The full tournament is disabled for pull requests and requires an explicitly approved workflow_dispatch run."

      - name: Run complete Legends round-robin tournament
        if: success() && github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true
        run: npm run tournament:legends -- --out=artifacts/legends-tournament

      - name: Supervise every tournament game and per-bot completion
        if: success() && github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true
        run: npm run audit:tournament -- --input=artifacts/legends-tournament/games.jsonl --summary=artifacts/legends-tournament/summary.json

      - name: Render per-game PNGs and update README galleries
        if: success() && github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true
        env:
          TOURNAMENT_PHASE: ${{ github.ref == 'refs/heads/main' && 'post-merge' || 'pre-merge' }}
        run: node scripts/render-tournament-evidence.mjs --input=artifacts/legends-tournament/games.jsonl --summary=artifacts/legends-tournament/summary.json --phase="$TOURNAMENT_PHASE"

      - name: Commit tournament evidence and README results
        if: success() && github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true
        env:
          TOURNAMENT_PHASE: ${{ github.ref == 'refs/heads/main' && 'post-merge' || 'pre-merge' }}
          PR_HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/tournaments/ public/data/bots/ docs/LEGENDS_PGN_RESEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record ${TOURNAMENT_PHASE} Legends tournament [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Verify branch deletion safety without deleting it
        if: github.ref == 'refs/heads/main' && success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-branch-deletion-safety.mjs

      - name: Render Tal match visualization after the post-merge tournament
        if: github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true && github.ref == 'refs/heads/main' && success()
        run: node scripts/render-tal-match-visualization.mjs --input=artifacts/legends-tournament/games.jsonl --opponent=capablanca

      - name: Commit post-merge interactive visualization
        if: github.event_name == 'workflow_dispatch' && inputs.tournament_approved == true && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/legends/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add verified Tal match visualization [skip ci]"
          git push origin HEAD:main

      - name: Upload Legends tournament report, PNGs, audit and branch-safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-tournament-evidence
          path: |
            artifacts/legends-tournament/
            artifacts/branch-deletion-safety.json
            docs/tournaments/
            public/legends/
          if-no-files-found: warn
          retention-days: 30
