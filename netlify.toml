[build]
  publish = "dist"
  command = "npm run build"

[[edge_functions]]
  function = "gate"
  path = "/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[functions]
  included_files = ["public/vendor/chessy-ai-fast.wasm", "data/puzzle-seed.json", "public/data/repertoire.json"]
